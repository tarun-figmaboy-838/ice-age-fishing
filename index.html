<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0b4fb8">
  <title>Popo's Shape Fishing</title>
  <link rel="preload" as="image" href="assets/backgrounds/location-1.webp">
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <div id="app" class="app">
    <div id="stage" class="stage">
      <canvas id="world" class="world" aria-hidden="true"></canvas>

      <div id="hits" class="hits"></div>
      <div id="hand" class="hand" hidden aria-hidden="true">
        <svg viewBox="0 0 64 64" width="100%" height="100%">
          <path d="M22 60c-6 0-9-4-11-9L5 36c-1-3 1-6 4-6s4 2 5 4l3 6V14c0-3 2-5 5-5s5 2 5 5v18h2V10c0-3 2-5 5-5s5 2 5 5v22h2V16c0-3 2-5 5-5s5 2 5 5v16h2v-8c0-3 2-5 5-5s5 2 5 5v22c0 10-7 14-16 14H22z" fill="#fff" stroke="#f08a1d" stroke-width="3" stroke-linejoin="round"/>
        </svg>
      </div>

      <div id="hud" class="hud" hidden>
        <div class="hud-top">
          <div id="location" class="pill location" aria-live="polite">
            <span id="location-name"></span>
            <span id="location-progress" class="dots" aria-label="Challenge progress"></span>
          </div>
          <div id="instruction" class="instruction" role="status" aria-live="polite">
            <span id="instruction-icon" class="shape-icon" aria-hidden="true"></span>
            <span id="instruction-text">Help Popo find the shapes!</span>
          </div>
          <div class="hud-buttons">
            <button id="btn-sound" class="icon-btn" type="button" aria-label="Sound on" aria-pressed="true">
              <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path class="spk" d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a9 9 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path class="mute" d="M16 9l5 6M21 9l-5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            </button>
            <button id="btn-pause" class="icon-btn" type="button" aria-label="Pause">
              <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"/></svg>
            </button>
          </div>
        </div>
        <div class="hud-bottom">
          <div id="collection" class="collection" aria-label="Shapes discovered">
            <span class="collection-label">Shapes found <b id="collection-count">0</b></span>
            <span id="collection-badges" class="badges"></span>
          </div>
        </div>
      </div>

      <section id="overlay-reward" class="overlay reward" hidden aria-labelledby="reward-name">
        <div class="reward-card">
          <button id="reward-fish" class="hero-fish" type="button" aria-label="Caught fish">
            <span class="hero-ring"></span>
            <span id="reward-fish-img" class="fish-img"></span>
            <span class="sparkles" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
          </button>
          <h2 id="reward-name" class="reward-name"></h2>
          <p id="reward-fact" class="reward-fact"></p>
          <button id="btn-continue" class="btn primary" type="button">Keep Exploring</button>
        </div>
      </section>

      <section id="overlay-pause" class="overlay pause" hidden aria-label="Paused">
        <div class="card">
          <h2>Paused</h2>
          <button id="btn-resume" class="btn primary" type="button">Resume</button>
          <button id="btn-restart" class="btn" type="button">Restart</button>
        </div>
      </section>

      <section id="overlay-summary" class="overlay summary" hidden aria-labelledby="summary-title">
        <div class="card wide">
          <h2 id="summary-title">Great fishing, Popo!</h2>
          <p class="summary-sub">Shapes discovered on the journey</p>
          <ul id="summary-list" class="summary-list"></ul>
          <button id="btn-play-again" class="btn primary" type="button">Play Again</button>
        </div>
      </section>

      <section id="screen-start" class="screen start" aria-label="Start">
        <div class="start-card">
          <h1 class="title"><span>Popo's</span> Shape Fishing</h1>
          <p class="tagline">Help Popo catch the shape fish on his icy journey.</p>
          <button id="btn-play" class="btn primary big" type="button">Play</button>
          <p id="loading" class="loading" role="status">Loading…</p>
        </div>
      </section>
    </div>
    <div id="rotate-hint" class="rotate-hint" hidden>Rotate your device for the best experience</div>
  </div>
  <script src="src/sprite-data.js" defer></script>
  <script src="src/levels.js" defer></script>
  <script src="src/state.js" defer></script>
  <script src="src/clock.js" defer></script>
  <script src="src/assets.js" defer></script>
  <script src="src/stage.js" defer></script>
  <script src="src/effects.js" defer></script>
  <script src="src/popo.js" defer></script>
  <script src="src/fish.js" defer></script>
  <script src="src/audio.js" defer></script>
  <script src="src/ui.js" defer></script>
  <script src="src/sequences.js" defer></script>
  <script src="src/game.js" defer></script>
  <script src="src/main.js" defer></script>
</body>
</html>
